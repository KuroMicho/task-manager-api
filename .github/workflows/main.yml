name: Node.js Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar entorno de Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"

      - name: Instalar dependencias limpias (Producción + Desarrollo)
        run: npm ci

      - name: Compilar aplicación (TypeScript a JS Nativo)
        run: npm run build --if-present

      - name: Ejecutar batería de pruebas (Jest / Supertest)
        env:
          NODE_ENV: test
          MONGO_URI_TEST: mongodb://localhost:27017/task_manager_test
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST || 'test_secret_key_123' }}
        run: npm test

      - name: Notificar Despliegue Automatizado a Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"